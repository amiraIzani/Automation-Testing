[pytest]
addopts =
    -s
    -v
    --strict-markers
    --html=reports/report.html
    --self-contained-html

testpaths = tests

markers =
    e2e: Alur E2E lengkap OPEL (continuous, 1 browser session)
    login: Modul Login (Azure AD B2C)
    safety: Modul HSS Safety (Reporting & Transaction)
    safety_view: Halaman View/Reporting Safety (read-only)
    safety_transaction: Halaman Transaction Safety (grid + modal)
    safety_toolbar: Toolbar tombol per halaman Safety (tampil + fungsi klik)
    safety_datatables: Interaksi DataTables Safety (sort, pagination, search, kolom)
    safety_export: Verifikasi isi file export Safety (.xlsx)
    safety_negatif: Negative case Safety (validasi form wajib)
    demo: Subset singkat (~30 test, +-4 menit) untuk demo -- daftar di DEMO_ITEM conftest.py

    # Marker TEMPLATE laporan -- ditempel OTOMATIS oleh
    # pytest_collection_modifyitems() di conftest.py berdasarkan URL
    # halaman. Dipakai menjawab "kegagalan ini kena satu halaman atau
    # satu template?" tanpa grep manual, mis. `pytest -m MonthlyReport`.
    DailyReport: Halaman bertemplate DailyReport (semua mode)
    MonthlyReport: Halaman bertemplate MonthlyReport (semua mode)
    YearlyReport: Halaman bertemplate YearlyReport (semua mode)
    StaticReport: Halaman bertemplate StaticReport (semua mode)
    DailyReport_Edit: DailyReport mode Edit
    MonthlyReport_Edit: MonthlyReport mode Edit
    MonthlyReport_View: MonthlyReport mode View
    YearlyReport_Edit: YearlyReport mode Edit
    YearlyReport_View: YearlyReport mode View
    StaticReport_Edit: StaticReport mode Edit
    Custom: Halaman di luar pola Timesheet (Safety Recap)
    safety_extra: Kumpulan test Safety tambahan (DataTables, export isi, leading deep, validasi form, filter unit)

log_date_format = %Y-%m-%d %H:%M:%S
