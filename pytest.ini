[pytest]
addopts =
    -s
    -v
    --strict-markers
    --html=reports/report.html
    --self-contained-html

testpaths = tests

markers =
    e2e: Alur E2E lengkap OPEL (continuous, 1 browser session)
    login: Modul Login (Azure AD B2C)
    safety: Modul HSS Safety (Reporting & Transaction)
    safety_view: Halaman View/Reporting Safety (read-only)
    safety_transaction: Halaman Transaction Safety (grid + modal)
    safety_toolbar: Toolbar tombol per halaman Safety (tampil + fungsi klik)
    safety_datatables: Interaksi DataTables Safety (sort, pagination, search, kolom)
    safety_export: Verifikasi isi file export Safety (.xlsx)
    safety_negatif: Negative case Safety (validasi form wajib)
    safety_extra: Kumpulan test Safety tambahan (DataTables, export isi, leading deep, validasi form, filter unit)

log_date_format = %Y-%m-%d %H:%M:%S
